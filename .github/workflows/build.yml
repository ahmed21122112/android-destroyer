name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython
          
      - name: Setup Android Command Line Tools
        run: |
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          mkdir -p $SDK_ROOT/tools/bin
          ln -s $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/sdkmanager
          ln -s $SDK_ROOT/cmdline-tools/latest/bin/avdmanager $SDK_ROOT/tools/bin/avdmanager
          
      - name: Accept Android Licenses
        run: |
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $SDK_ROOT/tools/bin/sdkmanager --licenses || true
          
      - name: Build APK
        run: |
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sysupdate-apk
          path: bin/*.apk
